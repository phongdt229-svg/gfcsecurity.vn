<style>
      .contact-item {
        position: relative;
      }

      .contact-item {
        overflow: visible;
        animation: tilt-shaking 1.5s ease-in-out infinite;
      }

      @keyframes tilt-shaking {

        0%,
        60%,
        100% {
          transform: rotate(0deg);
        }

        4% {
          transform: rotate(5deg);
        }

        8% {
          transform: rotate(0deg);
        }

        12% {
          transform: rotate(-5deg);
        }

        16% {
          transform: rotate(0deg);
        }
      }

      .contact-item::before,
      .contact-item::after,
      .contact-item .wave-effect {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 46px;
        z-index: -1;
        pointer-events: none;
      }

      .contact-item::before {
        animation: ripple 1.5s infinite linear;
      }

      .contact-item::after {
        animation: ripple 1.5s 0.5s infinite linear;
      }

      .contact-item .wave-effect {
        animation: ripple 1.5s 1.0s infinite linear;
      }

      @keyframes ripple {
        0% {
          box-shadow: 0 0 0 0 rgba(var(--ripple-color, 0, 128, 144), 1);
        }

        33% {
          box-shadow: 0 0 0 6px rgba(var(--ripple-color, 0, 128, 144), 0.7);
        }

        66% {
          box-shadow: 0 0 0 9px rgba(var(--ripple-color, 0, 128, 144), 0.5);
        }

        100% {
          box-shadow: 0 0 0 12px rgba(var(--ripple-color, 0, 128, 144), 0);
        }
      }

      @media screen and (max-width: 768px) {

        .contact-item {
          display: flex !important;
          align-items: center;
          border-radius: 46px;
          overflow: visible !important;
          position: relative;
          z-index: 10;
          opacity: 1 !important;
          visibility: visible !important;
        }

        .contact-item-container {
          position: relative;
          height: 40px;
          margin-bottom: 10px;
        }
      }


      .network-toggle-btn {
        cursor: pointer;
        transition: transform 0.3s ease;
      }

      .network-toggle-btn:hover {
        transform: scale(1.1);
      }

      .network-toggle-btn.active {
        transform: rotate(45deg);
      }

      .social-icons-container {
        position: absolute;
        bottom: 12%;
        right: 100%;
        display: flex;
        flex-direction: row;
        gap: 15px;
        margin-right: 15px;
        opacity: 0;
        visibility: hidden;
        transform: translateX(50px) translateY(50%);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        pointer-events: none;
      }

      .social-icons-container.show {
        opacity: 1;
        visibility: visible;
        transform: translateX(0) translateY(50%);
        pointer-events: all;
      }

      .social-icon-item {
        transform: translateX(30px) scale(0.8);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        opacity: 0;
      }

      .social-icons-container.show .social-icon-item {
        transform: translateX(0) scale(1);
        opacity: 1;
      }

      .social-icons-container.show .social-icon-item:nth-child(1) {
        transition-delay: 0.1s;
      }

      .social-icons-container.show .social-icon-item:nth-child(2) {
        transition-delay: 0.2s;
      }

      .social-icons-container.show .social-icon-item:nth-child(3) {
        transition-delay: 0.3s;
      }

      .social-icons-container.show .social-icon-item:nth-child(4) {
        transition-delay: 0.4s;
      }

      .social-icons-container.show .social-icon-item:nth-child(5) {
        transition-delay: 0.5s;
      }

      @media screen and (max-width: 768px) {
        .social-icons-container {
          flex-direction: column;
          gap: 16px;
          margin-right: 10px;
          max-height: 120px;
          flex-wrap: wrap;
          align-content: flex-start;
          width: auto;
          bottom: 30%;
          right: 450%;
        }

        .social-icons-container .social-icon-item {
          flex: 0 0 auto;
        }
      }

      @media screen and (max-width: 768px) {
        .entry-post-content p:has(img) {
          display: flex !important;
          flex-direction: column !important;
          gap: 10px !important;
        }
      }

      @media screen and (min-width: 768px) {
        .entry-post-content p:has(img) {
          display: flex !important;
          gap: 16px !important;
        }
      }

      /* Tailwind Classes Converted to Pure CSS */
      .fab-container {
        position: fixed;
        bottom: 1.25rem;
        right: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        z-index: 50;
      }

      @media screen and (min-width: 768px) {
        .fab-container {
          bottom: 1.5rem;
          right: 1.5rem;
        }
      }

      .contact-item {
        border: 1px solid;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        height: 44px;
        padding: 0 4px;
        gap: 8px;
        cursor: pointer;
        color: #fff;
      }

      .contact-item img {
        width: 36px;
        height: 36px;
      }

      .contact-item .contact-text {
        font-size: 12px;
        line-height: 1.2;
        white-space: nowrap;
        color: #fff;
      }

      @media screen and (max-width: 1024px) {
        .contact-item .contact-text {
          display: none !important;
        }
      }

      @media screen and (min-width: 1537px) {
        .contact-item .contact-text {
          font-size: 14px;
        }
      }

      .contact-item--scrolltop {
        justify-content: center;
        width: 36px;
        height: 36px;
        padding: 0;
        gap: 0;
        border-radius: 9999px;
        align-self: flex-end;
        /* move to right within column */
      }

      @media screen and (max-width: 768px) {
        .fab-container {
          right: 12px;
          bottom: calc(12px + env(safe-area-inset-bottom, 0));
          gap: 22px;
        }

        .contact-item {
          width: 36px;
          height: 36px;
          padding: 4px;
          gap: 6px;
        }

        .contact-item img {
          width: 30px;
          height: 30px;
        }

        .contact-item--scrolltop {
          width: 36px;
          height: 36px;
          padding: 0;
          align-self: flex-end;
        }
      }
    </style>

      <script>
      document.addEventListener('DOMContentLoaded', function() {
        const networkToggleBtn = document.getElementById('networkToggleBtn');
        const socialIconsContainer = document.getElementById('socialIconsContainer');

        if (networkToggleBtn && socialIconsContainer) {
          let isOpen = false;

          networkToggleBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            isOpen = !isOpen;
            if (isOpen) {
              networkToggleBtn.classList.add('active');
              socialIconsContainer.classList.add('show');
            } else {
              networkToggleBtn.classList.remove('active');
              socialIconsContainer.classList.remove('show');
            }
          });

          document.addEventListener('click', function(e) {
            if (isOpen && !networkToggleBtn.contains(e.target) && !socialIconsContainer.contains(e.target)) {
              isOpen = false;
              networkToggleBtn.classList.remove('active');
              socialIconsContainer.classList.remove('show');
            }
          });

          document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && isOpen) {
              isOpen = false;
              networkToggleBtn.classList.remove('active');
              socialIconsContainer.classList.remove('show');
            }
          });
        }
      });
    </script>
