  </style>
  <script>
    // ========== Mobile Menu Handler ==========
    document.addEventListener('DOMContentLoaded', function() {
      const toggle = document.getElementById('mobile-menu-toggle');
      const overlay = document.getElementById('mobile-menu-overlay');

      // Initialize overlay state
      if (toggle && overlay) {
        toggle.checked = false;
        overlay.classList.remove('open');

        overlay.addEventListener('click', function(e) {
          const menuContent = overlay.querySelector('.bg-white');
          if (!menuContent.contains(e.target)) {
            toggle.checked = false;
            overlay.classList.remove('open');
            document.body.style.overflow = '';
          }
        });

        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && toggle.checked) {
            toggle.checked = false;
            overlay.classList.remove('open');
            document.body.style.overflow = '';
          }
        });

        toggle.addEventListener('change', function() {
          if (this.checked) {
            document.body.style.overflow = 'hidden';
            setTimeout(function() {
              overlay.classList.add('open');
              const nav = overlay.querySelector('nav');
              if (nav) nav.scrollTop = 0;
            }, 10);
          } else {
            document.body.style.overflow = '';
            overlay.classList.remove('open');
            document.querySelectorAll('.mobile-menu .menu-item-has-children').forEach(function(item) {
              item.classList.remove('open');
            });
          }
        });

        function animateSubmenu(submenu, isOpening) {
          if (!submenu) return;

          if (isOpening) {
            submenu.style.maxHeight = 'none';
            const naturalHeight = submenu.scrollHeight;

            submenu.style.maxHeight = '0px';
            submenu.style.opacity = '0';

            submenu.offsetHeight;

            submenu.style.maxHeight = naturalHeight + 'px';
            submenu.style.opacity = '1';

            setTimeout(() => {
              if (submenu.parentElement.classList.contains('open')) {
                submenu.style.maxHeight = 'none';
              }
            }, 300);
          } else {
            const currentHeight = submenu.scrollHeight;
            submenu.style.maxHeight = currentHeight + 'px';
            submenu.style.opacity = '1';

            submenu.offsetHeight;

            submenu.style.maxHeight = '0px';
            submenu.style.opacity = '0';
          }
        }

        // Initialize submenu toggles
        function initializeSubmenuToggles() {
          document.querySelectorAll('.mobile-menu > .menu-item-has-children > a').forEach(function(link) {
            addToggleButton(link, 1);
          });

          document.querySelectorAll('.mobile-menu > .menu-item-has-children > .sub-menu > .menu-item-has-children > a').forEach(function(link) {
            addToggleButton(link, 2);
          });

          document.querySelectorAll('.mobile-menu > .menu-item-has-children > .sub-menu > .menu-item-has-children > .sub-menu > .menu-item-has-children > a').forEach(function(link) {
            addToggleButton(link, 3);
          });
        }

        function addToggleButton(link, level) {
          const className = `submenu-toggle-lv${level}`;

          if (link.querySelector(`.${className}`)) {
            return;
          }

          const toggleButton = document.createElement('span');
          toggleButton.className = className;
          link.appendChild(toggleButton);

          toggleButton.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const parentLi = link.parentElement;
            const submenu = parentLi.querySelector('.sub-menu');
            const isOpening = !parentLi.classList.contains('open');

            if (level === 1) {
              document.querySelectorAll('.mobile-menu > .menu-item-has-children').forEach(function(item) {
                if (item !== parentLi) {
                  item.classList.remove('open');
                  const otherSubmenu = item.querySelector('.sub-menu');
                  if (otherSubmenu) {
                    animateSubmenu(otherSubmenu, false);
                  }
                  item.querySelectorAll('.menu-item-has-children').forEach(function(nestedItem) {
                    nestedItem.classList.remove('open');
                  });
                }
              });
            } else if (level === 2) {
              const level1Parent = parentLi.closest('.mobile-menu > .menu-item-has-children');
              if (level1Parent) {
                level1Parent.querySelectorAll(':scope > .sub-menu > .menu-item-has-children').forEach(function(item) {
                  if (item !== parentLi) {
                    item.classList.remove('open');
                    const otherSubmenu = item.querySelector('.sub-menu');
                    if (otherSubmenu) {
                      animateSubmenu(otherSubmenu, false);
                    }
                    item.querySelectorAll('.menu-item-has-children').forEach(function(level3Item) {
                      level3Item.classList.remove('open');
                    });
                  }
                });
              }
            } else if (level === 3) {
              const level2Parent = parentLi.closest('.sub-menu > .menu-item-has-children');
              if (level2Parent) {
                level2Parent.querySelectorAll(':scope > .sub-menu > .menu-item-has-children').forEach(function(item) {
                  if (item !== parentLi) {
                    item.classList.remove('open');
                    const otherSubmenu = item.querySelector('.sub-menu');
                    if (otherSubmenu) {
                      animateSubmenu(otherSubmenu, false);
                    }
                  }
                });
              }
            }

            parentLi.classList.toggle('open');

            if (submenu) {
              animateSubmenu(submenu, isOpening);
            }
          });
        }

        // Initialize submenu toggles when menu opens
        function initializeMenuToggles() {
          setTimeout(function() {
            initializeSubmenuToggles();
            const level1Toggles = document.querySelectorAll('.mobile-menu > .menu-item-has-children > a > .submenu-toggle-lv1');
            const level2Toggles = document.querySelectorAll('.mobile-menu > .menu-item-has-children > .sub-menu > .menu-item-has-children > a > .submenu-toggle-lv2');
            const level3Toggles = document.querySelectorAll('.mobile-menu > .menu-item-has-children > .sub-menu > .menu-item-has-children > .sub-menu > .menu-item-has-children > a > .submenu-toggle-lv3');
          }, 100);
        }

        initializeSubmenuToggles();

        toggle.addEventListener('change', function() {
          if (this.checked) {
            initializeMenuToggles();
          }
        });

        const menuObserver = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.type === 'childList' && mutation.target.classList.contains('mobile-menu')) {
              setTimeout(function() {
                initializeSubmenuToggles();
              }, 50);
            }
          });
        });

        const mobileMenu = document.querySelector('.mobile-menu');
        if (mobileMenu) {
          menuObserver.observe(mobileMenu, {
            childList: true,
            subtree: true
          });
        }


        document.addEventListener('click', function(e) {
          // Check if clicked element is a submenu toggle (any level)
          const toggleBtn = e.target.closest('.submenu-toggle-lv1, .submenu-toggle-lv2, .submenu-toggle-lv3');
            if (toggleBtn) {
            e.preventDefault();
            e.stopPropagation();

            const link = toggleBtn.parentElement;
            const parentLi = link.parentElement;
              const submenu = parentLi.querySelector('.sub-menu');
              const isOpening = !parentLi.classList.contains('open');

            let level = 1;
            if (parentLi.closest('.mobile-menu > .menu-item-has-children') === parentLi) {
              level = 1;
            } else if (parentLi.closest('.mobile-menu > .menu-item-has-children > .sub-menu > .menu-item-has-children') === parentLi) {
              level = 2;
            } else if (parentLi.closest('.mobile-menu > .menu-item-has-children > .sub-menu > .menu-item-has-children > .sub-menu > .menu-item-has-children') === parentLi) {
              level = 3;
            }

            if (level === 1) {
              document.querySelectorAll('.mobile-menu > .menu-item-has-children').forEach(function(item) {
                if (item !== parentLi) {
                  item.classList.remove('open');
                  const otherSubmenu = item.querySelector('.sub-menu');
                  if (otherSubmenu) {
                    animateSubmenu(otherSubmenu, false);
                  }
                  item.querySelectorAll('.menu-item-has-children').forEach(function(nestedItem) {
                    nestedItem.classList.remove('open');
                  });
                }
              });
            } else if (level === 2) {
              const level1Parent = parentLi.closest('.mobile-menu > .menu-item-has-children');
              if (level1Parent) {
                level1Parent.querySelectorAll(':scope > .sub-menu > .menu-item-has-children').forEach(function(item) {
                  if (item !== parentLi) {
                    item.classList.remove('open');
                    const otherSubmenu = item.querySelector('.sub-menu');
                    if (otherSubmenu) {
                      animateSubmenu(otherSubmenu, false);
                    }
                    item.querySelectorAll('.menu-item-has-children').forEach(function(level3Item) {
                      level3Item.classList.remove('open');
                    });
                  }
                });
              }
            } else if (level === 3) {
              const level2Parent = parentLi.closest('.sub-menu > .menu-item-has-children');
              if (level2Parent) {
                level2Parent.querySelectorAll(':scope > .sub-menu > .menu-item-has-children').forEach(function(item) {
                  if (item !== parentLi) {
                    item.classList.remove('open');
                    const otherSubmenu = item.querySelector('.sub-menu');
                    if (otherSubmenu) {
                      animateSubmenu(otherSubmenu, false);
                    }
                  }
                });
              }
            }

            parentLi.classList.toggle('open');

            if (submenu) {
              animateSubmenu(submenu, isOpening);
            }
          }
        });
      }
    });
