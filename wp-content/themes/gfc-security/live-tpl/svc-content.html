<section class="container mx-auto px-4 mt-5 lg:mt-7.5 mb-5 lg:mb-15 2xl:mb-20">
    <div class="text-sm lg:text-base 2xl:text-lg relative" id="service-content-wrapper">
        <div id="service-content-collapsible" class="transition-all duration-300 entry-post-content">{{content}}</div>
        <div id="service-content-fade" class="pointer-events-none absolute bottom-0 left-0 right-0 h-16" style="display: none; background: linear-gradient(to top, rgba(255,255,255,1), rgba(255,255,255,0));"></div>
    </div>
    <div class="mt-3 flex justify-center" style="display: none;">
        <button type="button" id="service-content-toggle" class="inline-flex items-center gap-x-2.5 text-sm lg:text-base 2xl:text-lg text-primary hover:underline transition-all duration-300 cursor-pointer" aria-expanded="false">
            <span id="service-content-label">Xem thêm</span>
            <svg id="service-content-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewbox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 transition-transform duration-300">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"></path>
            </svg>
        </button>
    </div>
    </section>
